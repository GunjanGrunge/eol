name: Deploy Eolarity Innovations Website to Amazon S3

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to AWS S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web Application
        run: pnpm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy Build Artifacts to S3 Bucket
        run: |
          aws s3 sync ./dist s3://www.eolarityinnovations.com --delete --cache-control "max-age=31536000, public"
          aws s3 cp ./dist/index.html s3://www.eolarityinnovations.com/index.html --cache-control "no-cache"
