name: Deploy Eolarity Innovations Website to Amazon S3 (Keyless OIDC)

on:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Keyless Deploy to AWS S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web Application
        run: pnpm run build

      - name: Configure AWS Credentials (Keyless OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239280166793:role/GitHubActionsS3DeployRole
          aws-region: ap-south-1

      - name: Deploy Build Artifacts to S3 Bucket
        run: |
          aws s3 sync ./dist s3://www.eolarityinnovations.com --delete --cache-control "max-age=31536000, public"
          aws s3 cp ./dist/index.html s3://www.eolarityinnovations.com/index.html --cache-control "no-cache"

      - name: Invalidate CloudFront CDN Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E21B6WG63ECB7J --paths "/*"

